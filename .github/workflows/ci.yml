name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: bunx oxlint src/ index.ts

      - name: Test
        run: bun test
